name: Deploy Customer Loyalty Agent

on:
  push:
    branches: [main]
    paths:
      - 'src/infra/agents/customer-loyalty.json'
      - 'src/prompts/CustomerLoyaltyAgentPrompt.txt'
      - 'src/app/tools/discountLogic.py'
      - 'src/app/agents/customerLoyaltyAgent_initializer.py'
  workflow_dispatch:

jobs:
  deploy-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2.1.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Customer Loyalty agent to Microsoft Foundry
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          GPT_DEPLOYMENT: ${{ secrets.GPT_DEPLOYMENT }}
        run: |
          PAYLOAD=$(jq --arg model "$GPT_DEPLOYMENT" \
            --arg instructions "$(cat src/prompts/CustomerLoyaltyAgentPrompt.txt)" \
            '.definition.model = $model | .definition.instructions = $instructions' \
            src/infra/agents/customer-loyalty.json)

          az rest --method POST \
            --url "${FOUNDRY_ENDPOINT}/agents/customer-loyalty/versions?api-version=2025-11-15-preview" \
            --resource "https://ai.azure.com" \
            --body "$PAYLOAD" \
            --headers "Content-Type=application/json"

          echo "Customer Loyalty agent deployed successfully."
