name: Deploy Cora (Shopper) Agent

on:
  push:
    branches: [main]
    paths:
      - 'src/infra/agents/cora.json'
      - 'src/prompts/ShopperAgentPrompt.txt'
      - 'src/app/tools/aiSearchTools.py'
      - 'src/app/agents/shopperAgent_initializer.py'
  workflow_dispatch:

jobs:
  deploy-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2.1.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Cora agent to Microsoft Foundry
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          GPT_DEPLOYMENT: ${{ secrets.GPT_DEPLOYMENT }}
        run: |
          PAYLOAD=$(jq --arg model "$GPT_DEPLOYMENT" \
            --arg instructions "$(cat src/prompts/ShopperAgentPrompt.txt)" \
            '.definition.model = $model | .definition.instructions = $instructions' \
            src/infra/agents/cora.json)

          az rest --method POST \
            --url "${FOUNDRY_ENDPOINT}/agents/cora/versions?api-version=2025-11-15-preview" \
            --resource "https://ai.azure.com" \
            --body "$PAYLOAD" \
            --headers "Content-Type=application/json"

          echo "Cora agent deployed successfully."
